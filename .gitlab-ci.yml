### Prototype build jobs ###
.build_script: &build_script
  - cmake -S . -B build/ -GNinja $EXTRA_CMAKE_FLAGS
  - cmake --build build/

.test_script: &test_script
  - ctest -V --test-dir build/

.build:
  variables:
    EXTRA_CMAKE_FLAGS: ""
  script:
    - *build_script

.build_and_test:
  extends: .build
  script:
    - *build_script
    - *test_script

### Tests ###
test:debian:11:
  extends: .build_and_test
  stage: test
  needs: []
  image: volcart/vcbuilder-debian:11_v1.static
  variables:
    EXTRA_CMAKE_FLAGS: "-DEDUCE_CORE_BUILD_TESTS=ON"
  tags:
    - docker

examples:debian:11:
  extends: .build
  stage: test
  needs: []
  image: volcart/vcbuilder-debian:11_v1.static
  variables:
    EXTRA_CMAKE_FLAGS: "-DEDUCE_CORE_BUILD_EXAMPLES=ON"
  tags:
    - docker

### Docs ###
pages:
  stage: deploy
  image: debian:bullseye-backports
  before_script:
    - apt-get update
    - apt-get install -y build-essential doxygen graphviz texlive ghostscript
    - apt-get -t bullseye-backports install -y cmake
  script:
    - mkdir -p build/
    - mkdir -p public/
    - cmake -S . -B build/ -DEDUCE_CORE_BUILD_DOCS=ON
    - cmake --build build/ --target docs
    - mv build/docs/html/ public/docs/
  artifacts:
    paths:
      - public
  tags:
    - docker
  only:
    - develop
